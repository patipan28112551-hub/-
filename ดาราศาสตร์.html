<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบทดสอบกลางภาค: โลก ดาราศาสตร์ และอวกาศ (ม.6)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap');

        :root {
            --primary: #0a0e17;
            --primary-light: #121826;
            --bg: #030509;
            --card: rgba(20, 28, 45, 0.75);
            --text: #e0e6ed;
            --text-muted: #a0aec0;
            --accent: #2dccff;
            --accent-glow: rgba(45, 204, 255, 0.4);
            --border: #334155;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4), 0 4px 6px -2px rgba(0, 0, 0, 0.2);
        }

        body {
            font-family: 'Sarabun', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            position: relative;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* เอฟเฟกต์ดาวระยิบระยับในอวกาศ */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 3px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 2px),
                radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 3px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px;
            z-index: -1;
            opacity: 0.6;
            animation: starlight 100s linear infinite;
        }

        @keyframes starlight {
            from { background-position: 0 0, 40px 60px, 130px 270px; }
            to { background-position: 550px 550px, 390px 410px, 380px 520px; }
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .header {
            background: var(--primary-light);
            padding: 24px 30px;
            border-radius: 16px;
            box-shadow: var(--shadow), 0 0 15px var(--accent-glow);
            margin-bottom: 25px;
            position: sticky;
            top: 15px;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--accent);
            backdrop-filter: blur(10px);
        }

        .header h2 {
            color: var(--accent);
            margin: 0;
            font-size: 1.5rem;
            text-shadow: 0 0 8px var(--accent-glow);
        }

        .header small {
            color: var(--text-muted);
        }

        .timer {
            font-size: 1.3rem;
            font-weight: bold;
            color: #ffffff;
            background: #ff4757;
            padding: 8px 18px;
            border-radius: 10px;
            box-shadow: 0 0 12px rgba(255, 71, 87, 0.6);
        }

        .card {
            background: var(--card);
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            backdrop-filter: blur(8px);
            transition: all 0.25s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(45, 204, 255, 0.2);
        }

        .unit-title {
            background: var(--primary);
            color: var(--accent);
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 20px;
            border: 1px solid var(--accent);
            display: inline-block;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .pisa-box {
            background: rgba(45, 204, 255, 0.08);
            border-left: 4px solid var(--accent);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            color: var(--text);
            line-height: 1.7;
        }

        .pisa-box b {
            color: var(--accent);
        }

        .question {
            font-weight: 600;
            margin-bottom: 18px;
            font-size: 1.1rem;
            color: #ffffff;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 12px 18px;
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: rgba(10, 14, 23, 0.5);
        }

        .option-label:hover {
            background: rgba(45, 204, 255, 0.12);
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .option-label input {
            margin-right: 14px;
            accent-color: var(--accent);
            transform: scale(1.2);
            cursor: pointer;
        }

        .btn-submit {
            width: 100%;
            padding: 18px;
            background: var(--accent);
            color: var(--primary);
            border: none;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 25px;
            transition: all 0.3s;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .btn-submit:hover {
            background: #ffffff;
            color: var(--primary);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.8);
            transform: scale(1.01);
        }

        #result {
            display: none;
            text-align: center;
            padding: 25px;
            background: rgba(39, 174, 96, 0.2);
            color: #2ecc71;
            border-radius: 12px;
            margin-top: 25px;
            font-size: 1.7rem;
            font-weight: bold;
            border: 2px solid #2ecc71;
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.4);
        }

        .correct { 
            background: rgba(39, 174, 96, 0.25) !important; 
            border-color: #2ecc71 !important; 
            box-shadow: 0 0 12px rgba(46, 204, 113, 0.4) !important;
            color: #7bed9f !important;
        }
        .wrong { 
            background: rgba(235, 77, 75, 0.25) !important; 
            border-color: #ff4d4d !important; 
            box-shadow: 0 0 12px rgba(255, 77, 77, 0.4) !important;
            color: #ff7675 !important;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>
            <h2>🚀 ข้อสอบกลางภาค วิชาโลก ดาราศาสตร์ฯ</h2>
            <small>จำนวน 40 ข้อ | เลือกตอบข้อที่ถูกต้องที่สุด</small>
        </div>
        <div class="timer" id="timer">60:00</div>
    </div>

    <form id="quizForm">
        <div id="questionsContainer"></div>
        <button type="button" class="btn-submit" onclick="submitQuiz()">ส่งคำตอบ / ตรวจคะแนน 🌌</button>
    </form>

    <div id="result"></div>
</div>

<script>
const quizData = [
    // หน่วยที่ 1
    { unit: "🪐 หน่วยที่ 1: โครงสร้างโลก (ข้อ 1-12)", q: "1. หากแบ่งโครงสร้างโลกตาม **องค์ประกอบทางเคมี** จะแบ่งได้กี่ชั้น และชั้นใดมีหนาที่สุด?", options: ["ก. 3 ชั้น (เปลือกโลก, แมนเทิล, แก่นโลก) โดยแมนเทิลหนาที่สุด", "ข. 3 ชั้น (เปลือกโลก, แมนเทิล, แก่นโลก) โดยแก่นโลกหนาที่สุด", "ค. 5 ชั้น (ธรณีภาค, ฐานธรณีภาค, เมโซสเฟียร์, แก่นโลกชั้นนอก, แก่นโลกชั้นใน)", "ง. 5 ชั้น โดยฐานธรณีภาคหนาที่สุด"], a: 0 },
    { q: "2. เปลือกโลกทวีป (Continental Crust) และเปลือกโลกมหาสมุทร (Oceanic Crust) มีความแตกต่างกันอย่างไร?", options: ["ก. เปลือกโลกทวีปมีความหนาแน่นมากกว่าเปลือกโลกมหาสมุทร", "ข. เปลือกโลกทวีปประกอบด้วยหินบะซอลต์เป็นหลัก ส่วนเปลือกโลกมหาสมุทรเป็นหินแกรนิต", "ค. เปลือกโลกทวีปประกอบด้วยหินแกรนิตเป็นหลักและมีความหนาแน่นน้อยกว่าเปลือกโลกมหาสมุทร", "ง. ทั้งสองส่วนมีความหนาและองค์ประกอบเหมือนกันทุกประการ"], a: 2 },
    { q: "3. การแบ่งโครงสร้างโลกตาม **สมบัติเชิงกล** (Physical Properties) แบ่งออกเป็นกี่ชั้น?", options: ["ก. 3 ชั้น", "ข. 4 ชั้น", "ค. 5 ชั้น", "ง. 6 ชั้น"], a: 2 },
    { q: "4. ชั้น **ฐานธรณีภาค (Asthenosphere)** มีสมบัติเชิงกลเฉพาะตัวอย่างไรที่ส่งผลต่อการเคลื่อนตัวของแผ่นธรณี?", options: ["ก. เป็นของแข็งเกร็ง แข็งแรงมาก", "ข. มีลักษณะเป็นพลาสติก (Plastic) หรือของแข็งที่ไหลได้เนื่องจากความร้อนและความดันสูง", "ค. เป็นของเหลวหนาวเย็น", "ง. เป็นแก๊สความดันสูง"], a: 1 },
    { q: "5. ลำดับชั้นโครงสร้างโลกตามสมบัติเชิงกลจาก **นอกสุดไปสู่ข้างในสุด** ข้อใดถูกต้อง?", options: ["ก. ธรณีภาค -> เมโซสเฟียร์ -> ฐานธรณีภาค -> แก่นโลกชั้นนอก -> แก่นโลกชั้นใน", "ข. ธรณีภาค -> ฐานธรณีภาค -> เมโซสเฟียร์ -> แก่นโลกชั้นนอก -> แก่นโลกชั้นใน", "ค. ฐานธรณีภาค -> ธรณีภาค -> เมโซสเฟียร์ -> แก่นโลกชั้นนอก -> แก่นโลกชั้นใน", "ง. ธรณีภาค -> ฐานธรณีภาค -> แก่นโลกชั้นนอก -> เมโซสเฟียร์ -> แก่นโลกชั้นใน"], a: 1 },
    { q: "6. คลื่นไหวสะเทือนประเภท **คลื่นปฐมภูมิ (P-wave)** มีลักษณะสำคัญอย่างไร?", options: ["ก. เป็นคลื่นตามขวาง เคลื่อนที่ผ่านได้เฉพาะของแข็งเท่านั้น", "ข. เป็นคลื่นตามยาว เคลื่อนที่ผ่านได้ทั้งของแข็ง ของเหลว และแก๊ส", "ค. เป็นคลื่นที่เคลื่อนที่ได้เฉพาะบริเวณพื้นผิวโลกเท่านั้น", "ง. มีความเร็วช้ากว่าคลื่นทุติยภูมิ (S-wave)"], a: 1 },
    { q: "7. เหตุใดคลื่นทุติยภูมิ (S-wave) จึง **ไม่สามารถ** เคลื่อนที่ผ่านชั้นแก่นโลกชั้นนอก (Outer Core) ได้?", options: ["ก. เพราะแก่นโลกชั้นนอกมีความหนาแน่นสูงเกินไป", "ข. เพราะแก่นโลกชั้นนอกมีอุณหภูมิต่ำเกินไป", "ค. เพราะแก่นโลกชั้นนอกมีสถานะเป็นของเหลว", "ง. เพราะแก่นโลกชั้นนอกเป็นของแข็งบริสุทธิ์"], a: 2 },
    { q: "8. บริเวณ **Shadow Zone (เขตอับคลื่น)** ของคลื่น P และคลื่น S เกิดขึ้นเนื่องจากสาเหตุใดเป็นหลัก?", options: ["ก. การสะท้อนของคลื่นที่ชั้นบรรยากาศ", "ข. การหักเหและการดูดกลืนคลื่นเมื่อเคลื่อนผ่านชั้นที่มีสถานะและความหนาแน่นต่างกันภายในโลก", "ค. การหยุดหมุนของแก่นโลก", "ง. การรบกวนจากสนามแม่เหล็กโลก"], a: 1 },
    { q: "9. องค์ประกอบหลักของ **แก่นโลก (Core)** ทั้งชั้นนอกและชั้นในประกอบด้วยธาตุใดเป็นหลัก?", options: ["ก. ซิลิคอน (Si) และ อะลูมิเนียม (Al)", "ข. ซิลิคอน (Si) และ แมกนีเซียม (Mg)", "ค. เหล็ก (Fe) และ นิกเกิล (Ni)", "ง. คาร์บอน (C) และ แคลเซียม (Ca)"], a: 2 },
    { q: "10. นักวิทยาศาสตร์ทราบได้อย่างไรว่า **แก่นโลกชั้นใน (Inner Core)** มีสถานะเป็นของแข็ง ทั้งที่มีอุณหภูมิสูงมาก?", options: ["ก. ขุดเจาะลงไปเก็บตัวอย่างหินมาตรวจ", "ข. คลื่น P-wave มีความเร็วเพิ่มขึ้นเมื่อเคลื่อนที่ผ่านแก่นโลกชั้นใน และความดันมหาศาลบีบอัดไว้", "ค. ใช้ภาพถ่ายดาวเทียมอินฟราเรด", "ง. ตรวจพบภูเขาไฟระเบิดพ่นลาวาจากแก่นโลกชั้นในออกมา"], a: 1 },
    { q: "11. หลักฐานทางตรงและทางอ้อมใดบ้างที่ใช้ในการศึกษาโครงสร้างภายในโลก?", options: ["ก. หินพ่นจากภูเขาไฟ, ตัวอย่างจากการขุดเจาะ, อุกกาบาตเหล็ก, และคลื่นไหวสะเทือน", "ข. รังสีคอสมิก และระดับน้ำทะเล", "ค. ทิศทางของลมและอุณหภูมิชั้นบรรยากาศ", "ง. ซากฟอสซิลไดโนเสาร์เพียงอย่างเดียว"], a: 0 },
    { q: "12. ชั้น **ธรณีภาค (Lithosphere)** ประกอบด้วยส่วนใดบ้าง?", options: ["ก. เปลือกโลกทั้งหมด + แมนเทิลชั้นล่าง", "ข. เปลือกโลกทั้งหมด + ส่วนบนสุดของแมนเทิลชั้นบน (ที่เป็นของแข็งเกร็ง)", "ค. เฉพาะส่วนของเปลือกโลกทวีปเท่านั้น", "ง. แก่นโลกชั้นนอก + แก่นโลกชั้นใน"], a: 1 },

    // หน่วยที่ 2
    { unit: "🌍 หน่วยที่ 2: การแปรสัณฐานของแผ่นธรณี (ข้อ 13-25)", q: "13. อัลเฟรด เวเกเนอร์ (Alfred Wegener) เป็นผู้เสนอทฤษฎีใด?", options: ["ก. ทฤษฎีการขยายตัวของพื้นมหาสมุทร", "ข. ทฤษฎีการทอดตัวของแผ่นธรณี", "ค. ทฤษฎีทวีปเลื่อน (Continental Drift Theory)", "ง. ทฤษฎีการแลกเปลี่ยนความร้อนในแก่นโลก"], a: 2 },
    { q: "14. มหาทวีปโบราณที่เคยรวมเป็นแผ่นเดียวกันเมื่อประมาณ 200 ล้านปีก่อนตามทฤษฎีทวีปเลื่อนมีชื่อว่าอะไร?", options: ["ก. โรดิเนีย (Rodinia)", "ข. แพนเจีย (Pangaea)", "ค. กอนด์วานา (Gondwana)", "ง. ลอเรเซีย (Laurasia)"], a: 1 },
    { q: "15. ข้อใด **ไม่ใช่** หลักฐานที่สนับสนุนทฤษฎีทวีปเลื่อนของเวเกเนอร์?", options: ["ก. รอยต่อของขอบทวีปที่ฟิตกันได้", "ข. ซากดึกดำบรรพ์ชนิดเดียวกันที่พบบนทวีปที่อยู่ห่างไกลกัน", "ค. ร่องรอยการเคลื่อนตัวของธารน้ำแข็งโบราณ", "ง. วัดคลื่นสัญญาณวิทยุระหว่างทวีปในอดีต"], a: 3 },
    { q: "16. ทฤษฎีการขยายตัวของพื้นมหาสมุทร (Seafloor Spreading) ถูกเสนอโดยนักวิทยาศาสตร์ท่านใด?", options: ["ก. แฮร์รี เฮสส์ (Harry Hess)", "ข. อัลเฟรด เวเกเนอร์ (Alfred Wegener)", "ค. ชาร์ลส์ ดาร์วิน (Charles Darwin)", "ง. ไอแซก นิวตัน (Isaac Newton)"], a: 0 },
    { q: "17. อายุของหินบะซอลต์บนพื้นมหาสมุทรมีลักษณะอย่างไรเมื่อวัดจาก **สันเขากลางมหาสมุทร (Mid-Ocean Ridge)** ออกไปทั้งสองข้าง?", options: ["ก. ยิ่งใกล้สันเขา หินยิ่งมีอายุมาก", "ข. ยิ่งห่างจากสันเขาออกไป หินยิ่งมีอายูน้อย", "ค. ยิ่งห่างจากสันเขาออกไป หินยิ่งมีอายุมากขึ้นอย่างมีแบบแผนเท่าๆ กันทั้งสองข้าง", "ง. หินทุกบริเวณมีอายุเท่ากันทั้งหมด"], a: 2 },
    { q: "18. กลไกสำคัญที่สุดที่ขับเคลื่อนให้แผ่นธรณีเคลื่อนที่คืออะไร?", options: ["ก. การหมุนรอบตัวเองของโลก", "ข. วงจรการพัดพาความร้อน (Convection Cell) ในชั้นแมนเทิล", "ค. แรงดึงดูดของดวงจันทร์และดวงอาทิตย์", "ง. แรงลมพัดบนผิวโลก"], a: 1 },
    { q: "19. แผ่นธรณีเคลื่อนที่แยกออกจากกัน (Divergent Boundary) บริเวณมหาสมุทรจะทำให้เกิดภูมิประเทศแบบใด?", options: ["ก. ร่องลึกก้นมหาสมุทร (Trench)", "ข. เทือกเขาหิมาลัย", "ค. สันเขากลางมหาสมุทร (Mid-Ocean Ridge)", "ง. รอยเลื่อนซานแอนเดรียส"], a: 2 },
    { q: "20. เมื่อ **แผ่นมหาสมุทร ชนกับ แผ่นทวีป** เหตุใดแผ่นมหาสมุทรจึงมุดลงใต้แผ่นทวีป?", options: ["ก. เพราะแผ่นมหาสมุทรมีความหนาแน่นมากกว่า", "ข. เพราะแผ่นมหาสมุทรมีความหนาแน่นน้อยกว่า", "ค. เพราะแผ่นทวีปเคลื่อนที่เร็วกว่า", "ง. เพราะแผ่นมหาสมุทรเย็นกว่า"], a: 0 },
    { q: "21. การชนกันของ **แผ่นมหาสมุทร กับ แผ่นมหาสมุทร** มักทำให้เกิดลักษณะภูมิประเทศแบบใด?", options: ["ก. รอยเลื่อนเฉือนขนาน", "ข. หมู่เกาะภูเขาไฟรูปโค้ง (Island Arc) และร่องลึกก้นมหาสมุทร", "ค. หุบเขาทรุดบนทวีป", "ง. เทือกเขาสูงแบบไม่มีภูเขาไฟ"], a: 1 },
    { q: "22. การชนกันของ **แผ่นทวีป กับ แผ่นทวีป** เกิดภูมิประเทศที่สำคัญคือข้อใด?", options: ["ก. เทือกเขาสูงขนาดใหญ่ เช่น เทือกเขาหิมาลัย", "ข. สันเขากลางมหาสมุทรอินเดีย", "ค. ร่องลึกก้นมหาสมุทรมาเรียนา", "ง. ทะเลสาบขนาดใหญ่"], a: 0 },
    { q: "23. บริเวณ **รอยเลื่อนซานแอนเดรียส (San Andreas Fault)** จัดเป็นการเคลื่อนที่ของแผ่นธรณีแบบใด?", options: ["ก. แผ่นธรณีเคลื่อนที่เข้าหากัน", "ข. แผ่นธรณีเคลื่อนที่แยกออกจากกัน", "ค. แผ่นธรณีเคลื่อนที่ผ่านกันหรือเคลื่อนที่เฉือนกัน (Transform Boundary)", "ง. แผ่นธรณีจมตัวลงสู่แก่นโลก"], a: 2 },
    { q: "24. ภาวะ **สนามแม่เหล็กโลกตกค้าง (Paleomagnetism)** ที่พบบนพื้นมหาสมุทร มีรูปแบบอย่างไรที่สนับสนุนการขยายตัวของพื้นมหาสมุทร?", options: ["ก. มีทิศทางชี้ไปทางทิศเหนือทิศเดียวตลอด", "ข. มีสลับทิศทางแบบส่องกระจก (Symmetrical Pattern) ขนานไปกับแนวสันเขากลางมหาสมุทร", "ค. กระจายตัวแบบสุ่มไร้รูปแบบ", "ง. ไม่พบสนามแม่เหล็กตกค้างในหินบะซอลต์"], a: 1 },
    { q: "25. บริเวณวงแหวนแห่งไฟ (Ring of Fire) รอบมหาสมุทรแปซิฟิก เกิดจากขอบแผ่นธรณีแบบใดเป็นส่วนใหญ่?", options: ["ก. ขอบแผ่นธรณีแบบเคลื่อนที่แยกออกจากกัน", "ข. ขอบแผ่นธรณีแบบเคลื่อนที่เข้าหากัน (การมุดตัวของแผ่นธรณี)", "ค. ขอบแผ่นธรณีแบบเคลื่อนที่ผ่านกัน", "ง. ไม่ใช่บริเวณขอบแผ่นธรณี"], a: 1 },

    // หน่วยที่ 3
    { unit: "🌋 หน่วยที่ 3: ธรณีพิบัติภัย (ข้อ 26-37)", q: "26. ตำแหน่งศูนย์กลางการเกิดแผ่นดินไหวภายในโลก เรียกว่าอะไร?", options: ["ก. ศูนย์เหนือศูนย์เกิดแผ่นดินไหว (Epicenter)", "ข. จุดโฟกัส / ศูนย์เกิดแผ่นดินไหว (Focus or Hypocenter)", "ค. จุดยอดคลื่น", "ง. เขตรอยแยก"], a: 1 },
    { q: "27. ข้อใดคือความหมายของ **\"Epicenter\" (ศูนย์เหนือศูนย์เกิดแผ่นดินไหว)**?", options: ["ก. จุดใต้พื้นดินที่หินเกิดการหักหรือเลื่อนตัว", "ข. ตำแหน่งบนผิวโลกที่อยู่ตรงเหนือจุดเกิดแผ่นดินไหวภายในโลกพอดี", "ค. เครื่องมือวัดระดับความแรงของแผ่นดินไหว", "ง. ความเร็วของคลื่นที่เคลื่อนผ่านเปลือกโลก"], a: 1 },
    { q: "28. เครื่องมือที่ใช้ในการบันทึกการสั่นสะเทือนของแผ่นดินไหวคือข้อใด?", options: ["ก. Barometer", "ข. Anemometer", "ค. Seismograph (เครื่องวัดคลื่นไหวสะเทือน)", "ง. Thermometer"], a: 2 },
    { q: "29. หากเกิดแผ่นดินไหวขณะที่คุณอยู่ในอาคารสูง ข้อใดคือการปฏิบัติตนที่ถูกต้องและปลอดภัยที่สุด?", options: ["ก. รีบวิ่งลงบันไดหรือใช้ลิฟต์ทันที", "ข. หมอบใต้โต๊ะที่แข็งแรง หลบให้พ้นจากสิ่งของตกใส่ และยึดโต๊ะไว้", "ค. วิ่งไปที่กระจกหน้าต่างเพื่อร้องขอความช่วยเหลือ", "ง. กระโดดออกทางหน้าต่าง"], a: 1 },
    { q: "30. สาเหตุหลักของการเกิด **สึนามิ (Tsunami)** ในมหาสมุทรคือข้อใด?", options: ["ก. ลมพายุไต้ฝุ่นขนาดใหญ่", "ข. แผ่นดินไหวขนาดใหญ่ใต้ก้นมหาสมุทรที่มีการเคลื่อนที่ของเปลือกโลกในแนวดิ่ง", "ค. ปรากฏการณ์น้ำขึ้น-น้ำลงในวันเพ็ญ", "ง. การเปลี่ยนแปลงของอุณหภูมิน้ำทะเล"], a: 1 },
    { q: "31. สัญญาณเตือนภัยธรรมชาติที่สำคัญก่อนเกิดสึนามิบริเวณชายฝั่งคือข้อใด?", options: ["ก. ฝนตกหนักและมีลมพายุแรง", "ข. น้ำทะเลลดระดับลงอย่างรวดเร็วผิดปกติจนมองเห็นชายหาดลึกลงไป", "ค. ท้องฟ้าเปลี่ยนเป็นสีแดงก่ำ", "ง. อุณหภูมิอากาศร้อนขึ้นอย่างกะทันหัน"], a: 1 },
    { q: "32. เมื่อได้รับสัญญาณเตือนภัยสึนามิ ประชาชนบริเวณชายฝั่งควรปฏิบัติตนอย่างไร?", options: ["ก. รีบลงไปจับปลาที่เกยหาด", "ข. อพยพขึ้นที่สูงหรืออาคารคอนกรีตแข็งแรงสูงอย่างรวดเร็ว", "ค. นั่งรอสังเกตการณ์บนหาด", "ง. แล่นเรือเล็กเข้าหาชายฝั่งทันที"], a: 1 },
    { q: "33. แมกมา (Magma) และ ลาวา (Lava) มีความแตกต่างกันอย่างไร?", options: ["ก. แมกมาคือหินหลอมเหลวใต้ผิวโลก ส่วนลาวาคือหินหลอมเหลวที่พุ่งขึ้นมาสู่บนผิวโลกแล้ว", "ข. แมกมาคือหินหลอมเหลวที่เย็นตัวแล้ว ส่วนลาวาคือหินที่กำลังร้อน", "ค. แมกมาพบในมหาสมุทร ส่วนลาวาพบบนทวีป", "ง. ทั้งสองอย่างคือสิ่งเดียวกัน ไม่มีความแตกต่าง"], a: 0 },
    { q: "34. ความหนืดของแมกมาขึ้นอยู่กับปัจจัยใดเป็นสำคัญ และส่งผลต่อความรุนแรงของการระเบิดอย่างไร?", options: ["ก. ปริมาณซิลิกา (Si) — ซิลิกาสูง ความหนืดสูง ทำให้เกิดการระเบิดรุนแรง", "ข. ปริมาณเหล็ก — เหล็กสูง ความหนืดสูง ระเบิดไม่รุนแรง", "ค. อุณหภูมิ — ยิ่งร้อนยิ่งหนืดมาก", "ง. ความลึก — ยิ่งลึกยิ่งไหลง่าย"], a: 0 },
    { q: "35. อันตรายจากภูเขาไฟระเบิด ข้อใดถือเป็นภัยที่เคลื่อนที่เร็ว อุณหภูมิสูงมาก และอันตรายถึงชีวิตมากที่สุด?", options: ["ก. เถ้าภูเขาไฟ (Volcanic Ash)", "ข. กรดกำมะถัน", "ค. คลื่นไพโรคลาสติก (Pyroclastic Flow / กระแสกรวดภูเขาไฟร้อน)", "ง. หินออบซิเดียน"], a: 2 },
    { q: "36. หากพื้นที่ของคุณได้รับผลกระทบจาก **ฝุ่นเถ้าภูเขาไฟ** ปล่อยออกมาในอากาศ ควรปฏิบัติตนอย่างไร?", options: ["ก. ออกมารับอากาศบริสุทธิ์กลางแจ้ง", "ข. สวมหน้ากากอนามัย/แว่นตากันฝุ่น และอยู่ในอาคารปิดประตูหน้าต่างให้มิดชิด", "ค. รดน้ำบนหลังคาเพื่อให้ฝุ่นละลายเข้าบ้าน", "ง. ถอดหน้ากากเพื่อให้อาเจียนเอาฝุ่นออก"], a: 1 },
    { q: "37. ประเทศไทยเคยได้รับผลกระทบจากภัยสึนามิครั้งใหญ่ที่สุดเมื่อปี พ.ศ. 2547 มีสาเหตุมาจากเหตุการณ์ใด?", options: ["ก. ภูเขาไฟกรากะตัวระเบิด", "ข. แผ่นดินไหวขนาดใหญ่บริเวณหมู่เกาะสุมาตรา-อันดามัน", "ค. แผ่นดินไหวในรอยเลื่อนศรีสวัสดิ์", "ง. ดินถล่มใต้ทะเลบริเวณอ่าวไทย"], a: 1 },

    // หน่วยที่ 4
    { unit: "☄️ หน่วยที่ 4: ข้อ 38-40 (แนว PISA)", pisaText: "<b>📌 บทความสำหรับตอบคำถามข้อ 38-40: \"โครงการกู้วิกฤตโลกในอวกาศ\"</b><br>นักวิทยาศาสตร์จากองค์กรอวกาศนานาชาติตรวจพบดาวเคราะห์น้อย (Near-Earth Objects: NEOs) ดวงหนึ่งขนาดเส้นผ่านศูนย์กลางประมาณ 300 เมตร มีวิถีโคจรตัดผ่านทวิทิศทางและมีโอกาสชนโลกในอีก 10 ปีข้างหน้า ซึ่งหากชนจริงอาจสร้างความเสียหายระดับทวีป<br><br>มีเสนอแนวทางแก้ไข 2 แนวทางคือ:<br>• <b>วิธีที่ 1:</b> ใช้หัวหน้าระเบิดนิวเคลียร์ยิงทำลายดาวเคราะห์น้อยให้แตกเป็นชิ้นเล็กๆ<br>• <b>วิธีที่ 2:</b> ใช้วัตถุมวลมากมวลกระทบชน (Kinetic Impactor) เพื่อเบี่ยงเบนทิศทาง", q: "38. (PISA - วิเคราะห์เหตุผล) เหตุใดนักวิทยาศาสตร์ส่วนใหญ่จึง **ไม่แนะนำ** ให้ใช้วิธีที่ 1 (ยิงระเบิดนิวเคลียร์ทำลาย)?", options: ["ก. เพราะระเบิดนิวเคลียร์จะทำให้อุณหภูมิของโลกสูงขึ้นทันที", "ข. เพราะการแตกออกอาจกลายเป็นเศษชิ้นส่วนกัมมันตรังสีขนาดใหญ่จำนวนมากที่ยังคงพุ่งชนโลกหลายจุดพร้อมกัน", "ค. เพราะดาวเคราะห์น้อยจะสะท้อนระเบิดนิวเคลียร์กลับมายังโลก", "ง. เพราะนิวเคลียร์ไม่สามารถจุดชนวนในอวกาศได้"], a: 1 },
    { q: "39. (PISA - การประเมินหลักฐาน) ข้อใดคือข้อดีของการใช้วิธีเบี่ยงเบนวิถีโคจร เมื่อเปรียบเทียบกับการทำลายล้าง?", options: ["ก. ใช้งบประมาณมากกว่าและสร้างความตื่นตระหนกให้ประชาชน", "ข. การเปลี่ยนทิศทางเพียงเล็กน้อยตั้งแต่อยู่ไกล จะส่งผลให้ดาวเคราะห์น้อยเบี่ยงทิศออกไปพลาดการชนโลกได้อย่างปลอดภัย", "ค. สามารถทำได้ทันทีก่อนการชนเพียง 1 ชั่วโมง", "ง. ทำให้ดาวเคราะห์น้อยกลายเป็นดาวบริวารของโลกดวงใหม่"], a: 1 },
    { q: "40. (PISA - บทบาทขอ
